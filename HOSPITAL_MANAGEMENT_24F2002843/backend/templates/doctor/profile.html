{% extends "base.html" %}

{% block content %}
<div id="app" v-cloak>
    {% raw %}
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-md-block bg-light sidebar">
                <div class="position-sticky pt-3">
                    <h5 class="px-3"><i class="bi bi-hospital"></i> HMS Doctor</h5>
                    <ul class="nav flex-column">
                        <li class="nav-item"><a class="nav-link" href="/doctor/dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link" href="/doctor/patients"><i class="bi bi-people"></i> Patients</a></li>
                        <li class="nav-item"><a class="nav-link" href="/doctor/treatment"><i class="bi bi-clipboard-pulse"></i> Treatment</a></li>
                        <li class="nav-item"><a class="nav-link" href="/doctor/availability"><i class="bi bi-clock"></i> Availability</a></li>
                        <li class="nav-item"><a class="nav-link active" href="/doctor/profile"><i class="bi bi-person-circle"></i> Profile</a></li>
                        <li class="nav-item"><a class="nav-link" href="/logout"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-10 ms-sm-auto px-md-4">
                <div class="pt-3 pb-2 mb-3 border-bottom"><h1 class="h2">My Profile</h1></div>
                
                <div class="card">
                    <div class="card-body">
                        <div v-if="message" :class="'alert alert-' + messageType">{{ message }}</div>
                        
                        <form @submit.prevent="updateProfile">
                            <div class="mb-3">
                                <label class="form-label">Name</label>
                                <input type="text" class="form-control" v-model="profile.name" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" v-model="profile.email" disabled>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Contact</label>
                                <input type="text" class="form-control" v-model="profile.contact">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Specialization</label>
                                <input type="text" class="form-control" v-model="profile.specialization">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Experience (years)</label>
                                <input type="number" class="form-control" v-model="profile.experience">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Qualification</label>
                                <input type="text" class="form-control" v-model="profile.qualification">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Consultation Fee (₹)</label>
                                <input type="number" class="form-control" v-model.number="profile.fee" min="0">
                                <div class="form-text">Enter a non-negative amount you charge per consultation.</div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">New Password (leave blank to keep current)</label>
                                <input type="password" class="form-control" v-model="newPassword">
                            </div>
                            <button type="submit" class="btn btn-primary">Update Profile</button>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>
    {% endraw %}
    <script id="profile-json" type="application/json">{{ profile_data | tojson | safe }}</script>
</div>

{% endblock %}

{% block extra_js %}
<script>
const { createApp } = Vue;
createApp({
    data() {
        let serverProfile = {};
        const el = document.getElementById('profile-json');
        if (el && el.textContent) {
            try { serverProfile = JSON.parse(el.textContent); } catch (e) { serverProfile = {}; }
        }
        return { profile: serverProfile, newPassword: '', message: '', messageType: '' }
    },
    mounted() {
        if (!this.profile || Object.keys(this.profile).length === 0) {
            this.loadProfile();
        }
    },
    methods: {
        async loadProfile() {
            const response = await http.get('/doctor/api/profile');
            this.profile = response.data;
        },
        async updateProfile() {
            // basic validation for fee
            if (this.profile && (this.profile.fee === '' || this.profile.fee === null || this.profile.fee < 0)) {
                this.message = 'Fee must be a non-negative number.';
                this.messageType = 'danger';
                return;
            }
            const data = { ...this.profile };
            if (this.newPassword) data.password = this.newPassword;
            const response = await http.put('/doctor/api/profile', data);
            this.message = response.data.message;
            this.messageType = 'success';
            this.newPassword = '';
        }
    }
}).mount('#app');
</script>
{% endblock %}
