{% extends "base.html" %}

{% block title %}Login - Hospital Management System{% endblock %}

{% block content %}
<div id="app" v-cloak>
    {% raw %}
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-hospital"></i> Hospital Management System
            </a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <h3 class="text-center mb-4">Login</h3>
                        
                        <div v-if="message" :class="'alert alert-' + messageType" role="alert">
                            {{ message }}
                        </div>

                        <form @submit.prevent="handleLogin">
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" v-model="email" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" v-model="password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100" :disabled="loading">
                                <span v-if="loading" class="spinner-border spinner-border-sm me-2"></span>
                                Login
                            </button>
                        </form>

                        <div class="text-center mt-3">
                            <p>Don't have an account? <a href="/register">Register here</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    {% endraw %}
</div>

{% endblock %}

{% block extra_js %}
<script>
const { createApp } = Vue;

createApp({
    data() {
        return {
            email: '',
            password: '',
            message: '',
            messageType: '',
            loading: false
        }
    },
    methods: {
        async handleLogin() {
            this.loading = true;
            this.message = '';
            
            try {
                const response = await http.post('/login', {
                    email: this.email,
                    password: this.password
                });
                
                const role = response.data.role;
                window.location.href = `/${role}/dashboard`;
            } catch (error) {
                this.message = (error && error.response && error.response.data && error.response.data.message) ? error.response.data.message : 'Login failed';
                this.messageType = 'danger';
            } finally {
                this.loading = false;
            }
        }
    }
}).mount('#app');
</script>
{% endblock %}
