{% extends "base.html" %}

{% block title %}Register - Hospital Management System{% endblock %}

{% block content %}
<div id="app" v-cloak>
    {% raw %}
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-hospital"></i> Hospital Management System
            </a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h3 class="text-center mb-4">Patient Registration</h3>
                        
                        <div v-if="message" :class="'alert alert-' + messageType" role="alert">
                            {{ message }}
                        </div>

                        <form @submit.prevent="handleRegister">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Full Name *</label>
                                    <input type="text" class="form-control" v-model="formData.name" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Email *</label>
                                    <input type="email" class="form-control" v-model="formData.email" required>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Password *</label>
                                    <input type="password" class="form-control" v-model="formData.password" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Contact Number *</label>
                                    <input type="tel" class="form-control" v-model="formData.contact" required>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Date of Birth</label>
                                    <input type="date" class="form-control" v-model="formData.date_of_birth">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Gender</label>
                                    <select class="form-control" v-model="formData.gender">
                                        <option value="">Select</option>
                                        <option value="Male">Male</option>
                                        <option value="Female">Female</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Blood Group</label>
                                    <select class="form-control" v-model="formData.blood_group">
                                        <option value="">Select</option>
                                        <option value="A+">A+</option>
                                        <option value="A-">A-</option>
                                        <option value="B+">B+</option>
                                        <option value="B-">B-</option>
                                        <option value="O+">O+</option>
                                        <option value="O-">O-</option>
                                        <option value="AB+">AB+</option>
                                        <option value="AB-">AB-</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Emergency Contact</label>
                                    <input type="tel" class="form-control" v-model="formData.emergency_contact">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Address</label>
                                <textarea class="form-control" v-model="formData.address" rows="2"></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary w-100" :disabled="loading">
                                <span v-if="loading" class="spinner-border spinner-border-sm me-2"></span>
                                Register
                            </button>
                        </form>

                        <div class="text-center mt-3">
                            <p>Already have an account? <a href="/login">Login here</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    {% endraw %}
</div>

{% endblock %}

{% block extra_js %}
<script>
const { createApp } = Vue;

createApp({
    data() {
        return {
            formData: {
                name: '',
                email: '',
                password: '',
                contact: '',
                date_of_birth: '',
                gender: '',
                blood_group: '',
                emergency_contact: '',
                address: ''
            },
            message: '',
            messageType: '',
            loading: false
        }
    },
    methods: {
        async handleRegister() {
            this.loading = true;
            this.message = '';
            
            try {
                await http.post('/register', this.formData);
                this.message = 'Registration successful! Redirecting to login...';
                this.messageType = 'success';
                
                setTimeout(() => {
                    window.location.href = '/login';
                }, 2000);
            } catch (error) {
                this.message = (error && error.response && error.response.data && error.response.data.message) ? error.response.data.message : 'Registration failed';
                this.messageType = 'danger';
                this.loading = false;
            }
        }
    }
}).mount('#app');
</script>
{% endblock %}
