{% extends "base.html" %}

{% block title %}Admin - Doctors - HMS{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 d-md-block bg-light sidebar">
            <div class="position-sticky pt-3">
                <h5 class="px-3"><i class="bi bi-hospital"></i> HMS Admin</h5>
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link" href="/admin/dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/doctors"><i class="bi bi-person-badge"></i> Doctors</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/patients"><i class="bi bi-people"></i> Patients</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/appointments"><i class="bi bi-calendar-check"></i> Appointments</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/profile"><i class="bi bi-person-circle"></i> Profile</a></li>
                    <li class="nav-item"><a class="nav-link" href="/logout"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
                </ul>
            </div>
        </nav>

        <main class="col-md-10 ms-sm-auto px-md-4">
            <!-- Vue will mount inside this element. Keep the sidebar server-rendered. -->
            <div id="vue-root" v-cloak></div>
        </main>
    </div>
    <!-- modal/backdrop and all interactive UI are rendered by the Vue SFC mounted into #vue-root -->
</div>

{% endblock %}

{% block page_assets %}
    <script src="/static/main.js"></script>
{% endblock %}
